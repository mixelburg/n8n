name: 'Test: E2E Infrastructure'

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/testing/playwright/tests/infrastructure/**'
      - 'packages/testing/playwright/utils/benchmark/**'
      - 'packages/testing/playwright/utils/performance-helper.ts'
      - 'packages/testing/playwright/reporters/benchmark-summary-reporter.ts'
      - 'packages/testing/containers/services/**'
      - '.github/workflows/test-e2e-infrastructure-reusable.yml'

concurrency:
  group: e2e-infrastructure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-docker:
    uses: ./.github/workflows/prepare-docker-reusable.yml
    secrets: inherit

  benchmark:
    needs: [prepare-docker]
    name: ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: benchmarking
            runner: blacksmith-8vcpu-ubuntu-2204
    uses: ./.github/workflows/test-e2e-reusable.yml
    with:
      test-mode: docker-artifact
      # Smoke set: validate CI reproduces local findings before expanding to full suite.
      # Covers the three specs that surfaced the SET search_path / pool-churn finding:
      #   - single-instance-ceiling (Kafka direct mode baseline)
      #   - webhook-ingestion-ceiling (queue mode, where pool starvation is visible)
      #   - webhook-direct-mode-ceiling (direct mode comparison)
      # Note: wrapper appends `--workers=$WORKERS --shard=...` so we override workers via input.
      test-command: "pnpm --filter=n8n-playwright test:all --project=${{ matrix.profile }}:infrastructure --grep 'single instance|maximum webhook ingestion'"
      workers: '1'
      runner: ${{ matrix.runner }}
      timeout-minutes: 60
    secrets: inherit
